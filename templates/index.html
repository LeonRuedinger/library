<header class="top">
  <span>$site</span>
</header>
<main class="wrap">
<div class="card">
<input id="q" class="search" type="search" placeholder="$search" aria-label="$search">
<div class="count-row">
    <p class="count" id="n" data-t="$count_template">$count</p>
    <a href="archived.html" id="archive-link" class="archive-link">Archived books</a>
</div>

$book_form

<div class="audiobook-check-row">
    <button type="button" id="open-audiobook-check">
        <span aria-hidden="true">🎧</span>
        Check audiobook availability
    </button>
</div>

<div class="grid">$cards</div>
</div>
</main>
