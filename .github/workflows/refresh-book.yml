
name: Refresh audiobook links for one book

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: Stable five-character book ID
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Resolve book ID and refresh audiobook links
        env:
          BOOK_ID: ${{ inputs.book_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          book_id = os.environ["BOOK_ID"]

          if not re.fullmatch(r"[a-z0-9]{5}", book_id):
              sys.exit("Invalid book ID")

          with open("books_linked.ids.json", encoding="utf-8") as f:
              ids = json.load(f)["ids"]

          matches = [
              key for key, value in ids.items()
              if value == book_id
          ]

          if len(matches) != 1:
              sys.exit(f"Expected one ID mapping, found {len(matches)}")

          title, author = matches[0].split("|", 1)

          subprocess.run([
              "python", "audiolink.py", "books.csv",
              "--out", "books_linked.csv",
              "--exact-title", title,
              "--exact-author", author,
              "--overwrite",
              "--retry"
          ], check=True)
          PY

      - name: Save scraper results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add books_linked.csv books_linked.csv.state.json

          if git diff --cached --quiet; then
            echo "No scraper changes to save."
          else
            git commit -m "Refresh audiobook links for ${{ inputs.book_id }}"
            git push
          fi

      - name: Trigger website rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/actions/workflows/rebuild-site.yml/dispatches" \
            -f ref=main