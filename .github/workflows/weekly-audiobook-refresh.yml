
name: Weekly audiobook availability refresh

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-audiobook-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Refresh audiobook availability
        run: |
          python audiolink.py books.csv \
            --out books_linked.csv \
            --refresh

      - name: Save updated availability data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add books_linked.csv books_linked.csv.state.json

          if [ -f availability_history.csv ]; then
            git add availability_history.csv
          fi

          if [ -f review.csv ]; then
            git add review.csv
          fi

          if git diff --cached --quiet; then
            echo "No availability changes to save."
          else
            git commit -m "Weekly audiobook availability refresh"
            git push
          fi
