
name: Rebuild and deploy website

on:
  workflow_dispatch:
    inputs:
      delete_book_id:
        description: "Book ID to permanently delete (leave empty for normal rebuild)"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write


jobs:
  rebuild:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt


      - name: Delete book if requested
        if: ${{ inputs.delete_book_id != '' }}
        env:
          BOOK_ID: ${{ inputs.delete_book_id }}
        run: python delete_book.py "$BOOK_ID"

      - name: Commit deletion
        if: ${{ inputs.delete_book_id != '' }}
        env:
          BOOK_ID: ${{ inputs.delete_book_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Permanently delete book $BOOK_ID"
            git push
          fi

      - name: Generate website
        run: |
          python bookpages.py books_linked.csv \
            --with-index \
            --covers-dir . \
            --master-csv books.csv

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Wait for artifact indexing
        run: sleep 5

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
