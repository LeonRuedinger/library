
name: Build and deploy website

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build-pending:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate website with processing placeholders
        run: |
          python bookpages.py books_test_linked.csv \
            --with-index \
            --covers-dir . \
            --master-csv books_test.csv

      - name: Upload pending website
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-pending
          path: ./site

  deploy-pending:
    needs: build-pending
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy pending website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-pending

  build-final:
    needs: deploy-pending
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run audiobook scraper
        run: python audiolink.py books_test.csv

      - name: Generate final website
        run: |
          python bookpages.py books_test_linked.csv \
            --with-index \
            --covers-dir . \
            --master-csv books_test.csv

      - name: Save scraper results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add books_test_linked.csv books_test_linked.csv.state.json

          if git diff --cached --quiet; then
            echo "No scraper changes to save."
          else
            git commit -m "Update audiobook links"
            git push
          fi

      - name: Upload final website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy-final:
    needs: build-final
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy final website
        id: deployment
        uses: actions/deploy-pages@v4
