
name: Build and deploy website

on: [workflow_dispatch]

jobs:
  # 1. Build and upload the placeholder website
  build-pending:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate website with processing placeholders
        run: |
          python bookpages.py books_linked.csv \
            --with-index \
            --covers-dir . \
            --master-csv books.csv

      - name: Upload pending website
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-pending
          path: ./site

  # 2. Deploy placeholders, then scrape and build the final website
  process-books:
    needs: build-pending
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment-pending.outputs.page_url }}

    steps:
      - name: Deploy pending website
        id: deployment-pending
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-pending

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run audiobook scraper
        run: python audiolink.py books.csv

      - name: Generate final website
        run: |
          python bookpages.py books_linked.csv \
            --with-index \
            --covers-dir . \
            --master-csv books.csv

      - name: Save scraper results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add books_linked.csv books_linked.csv.state.json

          if git diff --cached --quiet; then
            echo "No scraper changes to save."
          else
            git commit -m "Update audiobook links"
            git push
          fi

      - name: Upload final website
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-final
          path: ./site

  # 3. Deploy the final website
  deploy-final:
    needs: process-books
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment-final.outputs.page_url }}

    steps:
      - name: Deploy final website
        id: deployment-final
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-final
