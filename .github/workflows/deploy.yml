
name: Build and deploy website

on: [workflow_dispatch]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment-final.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # First publish: show the new book with a processing placeholder.
      - name: Generate website with processing placeholders
        run: |
          python bookpages.py books_linked.csv \
            --with-index \
            --covers-dir . \
            --master-csv books.csv

      - name: Upload pending website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy pending website
        id: deployment-pending
        uses: actions/deploy-pages@v4

      # Only install the browser after the pending website is live.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run audiobook scraper
        run: python audiolink.py books.csv

      - name: Generate final website
        run: |
          python bookpages.py books_linked.csv \
            --with-index \
            --covers-dir . \
            --master-csv books.csv

      - name: Save scraper results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add books_linked.csv books_linked.csv.state.json

          if git diff --cached --quiet; then
            echo "No scraper changes to save."
          else
            git commit -m "Update audiobook links"
            git push
          fi

      - name: Upload final website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy final website
        id: deployment-final
        uses: actions/deploy-pages@v4
